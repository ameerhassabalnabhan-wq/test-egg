<body>

<div class="container">

    <div class="header">
        <h1>🥚 حساب نسبة الخصوبة</h1>
        <p>Hatchery Fertility Calculator</p>
    </div>

    <!-- خانة عدد الأقفاص -->
    <div class="input-group">
        <label>عدد الأقفاص المفحوصة</label>
        <input
            type="number"
            id="cages"
            min="0"
            placeholder="عدد الأقفاص"
        >
    </div>

    <!-- خانة عدد البيض غير المخصب -->
    <div class="input-group">
        <label>عدد البيض غير المخصب</label>
        <input
            type="number"
            id="infertile"
            min="0"
            placeholder="عدد البيض غير المخصب"
        >
    </div>

    <!-- النتيجة الظاهرة للمستخدم -->
    <div class="result">
        <h3>نسبة الخصوبة</h3>
        <h2 id="percentage">0.00%</h2>
    </div>

    <!-- التقرير الذي يتم تصويره -->
    <div id="captureArea" style="position:absolute; left:-9999px; top:0; width:380px;">

        <div class="captureHeader">
            <h2>🥚 Hatchery Report</h2>
            <p>FERTILITY RESULT</p>
        </div>

        <div class="captureResult">
            <span>نسبة الخصوبة</span>
            <h1 id="imagePercentage">0.00%</h1>
        </div>

        <div class="captureFooter">
            <strong>Amir Hassan</strong><br>
            Programmer & Developer
        </div>

    </div>

    <div class="buttons">
        <button class="capture" onclick="captureImage()">
            📸 التقاط صورة النسبة
        </button>

        <button class="reset" onclick="resetCalculator()">
            مسح البيانات
        </button>
    </div>

</div>

<script>

const cagesInput = document.getElementById("cages");
const infertileInput = document.getElementById("infertile");

function calculate() {

    // البيانات المدخلة
    const cages = Number(cagesInput.value) || 0;
    const infertile = Number(infertileInput.value) || 0;

    // إجمالي البيض
    const totalEggs = cages * 150;

    // إضافة 8 بيضات لكل قفص
    const extraEggs = cages * 8;

    // العاطل النهائي
    const totalInfertile = infertile + extraEggs;

    // البيض المخصب
    const fertileEggs = totalEggs - totalInfertile;

    // النسبة
    let percentage = 0;

    if (totalEggs > 0 && fertileEggs >= 0) {
        percentage = (fertileEggs / totalEggs) * 100;
    }

    // عرض النسبة فقط
    const finalPercentage = percentage.toFixed(2) + "%";

    document.getElementById("percentage").textContent = finalPercentage;
    document.getElementById("imagePercentage").textContent = finalPercentage;
}

// تحديث مباشر
cagesInput.addEventListener("input", calculate);
infertileInput.addEventListener("input", calculate);

// التقاط صورة
async function captureImage() {

    if (Number(cagesInput.value) <= 0 || cagesInput.value === "") {
        alert("أدخل عدد الأقفاص أولاً");
        return;
    }

    calculate();

    const area = document.getElementById("captureArea");

    try {

        const canvas = await html2canvas(area, {
            scale: 3,
            backgroundColor: "#ffffff"
        });

        const link = document.createElement("a");

        link.download = "Amir-Hassan-Fertility.png";
        link.href = canvas.toDataURL("image/png");

        link.click();

    } catch (error) {
        alert("حدث خطأ أثناء التقاط الصورة");
    }
}

// مسح الحقول
function resetCalculator() {
    cagesInput.value = "";
    infertileInput.value = "";
    calculate();
}

calculate();

</script>

</body>
