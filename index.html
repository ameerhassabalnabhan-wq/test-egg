<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hatchery Fertility Calculator</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    margin: 0;
    padding: 0;
}

body {
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #353535;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #070707;
    padding: 25px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.07);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    color: #bea200;
    font-size: 25px;
    margin: 0 0 8px;
}

.header p {
    color: #ffffff;
    font-size: 14px;
    margin: 0;
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 10px;
    color: #ff5050;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    border: 1px solid #dbe5df;
    border-radius: 12px;
    outline: none;
    background: #f9fbfa;
}

input:focus {
    border-color: #2a8056;
}

.result {
    margin-top: 25px;
    background: #1b6042;
    color: white;
    padding: 25px 15px;
    border-radius: 18px;
    text-align: center;
}

.result h3 {
    margin: 0;
    font-size: 15px;
    font-weight: normal;
    opacity: 0.9;
}

.result h2 {
    font-size: 48px;
    margin: 15px 0 0;
}

.buttons {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

button {
    border: none;
    padding: 15px;
    font-size: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.capture {
    background: #1b6042;
    color: white;
}

.reset {
    background: #e9efeb;
    color: #345341;
}

button:active {
    transform: scale(0.98);
}

/* نافذة معاينة وحفظ الصورة */
#previewModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
}

#previewModal img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

#previewModal p {
    color: #E8D19A;
    font-size: 14px;
    margin: 15px 0;
    text-align: center;
    line-height: 1.6;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 380px;
}

.modal-buttons button, .modal-buttons a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 13px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
}

.download-btn {
    background: #1b6042;
    color: white;
}

.close-btn {
    background: #ff5050;
    color: white;
}

@media (max-width: 380px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    .result h2 {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🥚 حساب نسبة الخصوبة</h1>
        <p>Hatchery Fertility Calculator</p>
    </div>

    <div class="input-group">
        <label>عدد الأقفاص المفحوصة</label>
        <input
            type="number"
            id="cages"
            min="0"
            inputmode="numeric"
            placeholder="عدد الأقفاص"
        >
    </div>

    <div class="input-group">
        <label>عدد البيض غير المخصب</label>
        <input
            type="number"
            id="infertile"
            min="0"
            inputmode="numeric"
            placeholder="عدد البيض غير المخصب"
        >
    </div>

    <div class="result">
        <h3>نسبة الخصوبة</h3>
        <h2 id="percentage">0.00%</h2>
    </div>

    <div class="buttons">
        <button class="capture" onclick="captureImage()">
            📸 التقاط صورة النسبة
        </button>

        <button class="reset" onclick="resetCalculator()">
            مسح البيانات
        </button>
    </div>

</div>

<!-- نافذة عرض وحفظ الصورة -->
<div id="previewModal">
    <img id="resultImg" src="" alt="Fertility Report">
    <p>اضغط على "تنزيل" أو اضغط مطولاً على الصورة لحفظها في الاستوديو</p>
    <div class="modal-buttons">
        <a id="downloadLink" class="download-btn" download="Amir-Hassan-Fertility.png">⬇️ تنزيل</a>
        <button class="close-btn" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
const cagesInput = document.getElementById("cages");
const infertileInput = document.getElementById("infertile");
let currentPercentage = "0.00%";

function calculate() {
    const cages = Number(cagesInput.value) || 0;
    const infertile = Number(infertileInput.value) || 0;

    const totalEggs = cages * 150;
    const extraEggs = cages * 8;
    const totalInfertile = infertile + extraEggs;
    const fertileEggs = totalEggs - totalInfertile;

    let percentage = 0;

    if (totalEggs > 0 && fertileEggs >= 0) {
        percentage = (fertileEggs / totalEggs) * 100;
    }

    currentPercentage = percentage.toFixed(2) + "%";
    document.getElementById("percentage").textContent = currentPercentage;
}

cagesInput.addEventListener("input", calculate);
infertileInput.addEventListener("input", calculate);

// دالة رسم المستطيل ذو الزوايا الدائرية
function drawRoundedRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
}

function captureImage() {
    if (Number(cagesInput.value) <= 0 || cagesInput.value === "") {
        alert("أدخل عدد الأقفاص أولاً");
        return;
    }

    calculate();

    // إنشاء لوحة رسم عالية الدقة (3x) بدون الحاجة لأي مكتبة خارجية
    const scale = 3;
    const width = 380;
    const height = 390;

    const canvas = document.createElement("canvas");
    canvas.width = width * scale;
    canvas.height = height * scale;

    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);

    // 1. الخلفية الرئيسية الداكنة
    ctx.fillStyle = "#111111";
    ctx.fillRect(0, 0, width, height);

    // 2. العنوان الرئيسي
    ctx.textAlign = "center";
    ctx.fillStyle = "#C9A24D";
    ctx.font = "bold 23px Arial, sans-serif";
    ctx.fillText("🥚 Hatchery Report", width / 2, 52);

    ctx.fillStyle = "#8F7134";
    ctx.font = "bold 12px Arial, sans-serif";
    ctx.fillText("FERTILITY RESULT", width / 2, 74);

    // 3. صندوق النتيجة الداخلي
    drawRoundedRect(ctx, 25, 98, width - 50, 165, 15);
    ctx.fillStyle = "#1C1C1C";
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#3B3324";
    ctx.stroke();

    // نص "نسبة الخصوبة"
    ctx.fillStyle = "#C9A24D";
    ctx.font = "bold 16px Arial, sans-serif";
    ctx.fillText("نسبة الخصوبة", width / 2, 138);

    // الرقم الكبير للنسبة
    ctx.fillStyle = "#E8D19A";
    ctx.font = "bold 54px Arial, sans-serif";
    ctx.fillText(currentPercentage, width / 2, 215);

    // 4. الخط الفاصل والتذييل
    ctx.beginPath();
    ctx.moveTo(25, 290);
    ctx.lineTo(width - 25, 290);
    ctx.strokeStyle = "#3B3324";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#C9A24D";
    ctx.font = "bold 16px Arial, sans-serif";
    ctx.fillText("Amir Hassan", width / 2, 326);

    ctx.fillStyle = "#B7B0A0";
    ctx.font = "14px Arial, sans-serif";
    ctx.fillText("Programmer & Developer", width / 2, 352);

    // تحويل الرسم إلى صورة وعرضها وحفظها
    const imgData = canvas.toDataURL("image/png");

    document.getElementById("resultImg").src = imgData;
    document.getElementById("downloadLink").href = imgData;
    document.getElementById("previewModal").style.display = "flex";

    // محاولة التنزيل التلقائي
    const link = document.createElement("a");
    link.download = "Amir-Hassan-Fertility.png";
    link.href = imgData;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function closeModal() {
    document.getElementById("previewModal").style.display = "none";
}

function resetCalculator() {
    cagesInput.value = "";
    infertileInput.value = "";
    calculate();
}

calculate();
</script>

</body>
</html>
